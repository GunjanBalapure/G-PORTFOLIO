<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
  </defs>
  <!-- Dark background -->
  <rect width="100" height="100" rx="22" fill="#070913" />
  <!-- Subtle blue/purple border -->
  <rect x="4" y="4" width="92" height="92" rx="18" fill="none" stroke="url(#grad)" stroke-width="3" opacity="0.8" />
  <!-- Simple white lettering -->
  <text x="46" y="66" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="-2">GB</text>
  <!-- Subtle accent dot -->
  <circle cx="78" cy="66" r="6" fill="#38bdf8" />
</svg>